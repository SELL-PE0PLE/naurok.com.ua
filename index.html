<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шпаргалка НаУрок</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        :root {
            --bg-color: #f4f5f7;
            --card-bg: #ffffff;
            --text-main: #111827;
            --success-bg: #e6f4ea;
            --success-border: #ceead6;
            --success-text: #137333;
            --neutral-bg: #f8f9fa;
            --neutral-border: #e9ecef;
            --badge-bg: #202124;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            font-size: 20px;
            text-align: center;
            margin-bottom: 20px;
        }

        .upload-box {
            background: var(--card-bg);
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            margin-bottom: 20px;
            cursor: pointer;
        }

        .upload-box input {
            display: none;
        }

        .upload-btn {
            background: #1a73e8;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            display: inline-block;
            font-weight: 500;
            margin-top: 10px;
        }

        .question-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .question-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .question-number {
            background: var(--badge-bg);
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
        }

        .status-badge {
            font-size: 13px;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 500;
        }

        .status-badge.correct {
            background: #ceead6;
            color: var(--success-text);
        }

        .status-badge.none {
            background: #e8eaed;
            color: #5f6368;
        }

        .question-text {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            line-height: 1.4;
        }

        .option {
            background: var(--neutral-bg);
            border: 1px solid var(--neutral-border);
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 8px;
            font-size: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            line-height: 1.3;
        }

        .option.is-correct {
            background: var(--success-bg);
            border-color: var(--success-border);
            color: var(--success-text);
        }
