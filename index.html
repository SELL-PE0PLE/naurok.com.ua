<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шпаргалка НаУрок (v5.0)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        :root {
            --bg-color: #f4f5f7;
            --card-bg: #ffffff;
            --text-main: #111827;
            --success-bg: #e6f4ea;
            --success-border: #ceead6;
            --success-text: #137333;
            --neutral-bg: #f8f9fa;
            --neutral-border: #e9ecef;
            --badge-bg: #202124;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            font-size: 20px;
            text-align: center;
            margin-bottom: 5px;
        }

        .version {
            font-size: 12px;
            text-align: center;
            color: #6b7280;
            margin-bottom: 20px;
        }

        .upload-box {
            background: var(--card-bg);
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            margin-bottom: 20px;
            cursor: pointer;
        }

        .upload-box input {
            display: none;
        }

        .upload-btn {
            background: #1a73e8;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            display: inline-block;
            font-weight: 500;
            margin-top: 10px;
        }

        .question-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .question-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .question-number {
            background: var(--badge-bg);
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
        }

        .status-badge {
            font-size: 13px;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 500;
        }

        .status-badge.correct {
            background: #ceead6;
            color: var(--success-text);
        }

        .status-badge.none {
            background: #e8eaed;
            color: #5f6368;
        }

        .question-text {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            line-height: 1.4;
        }

        .option {
            background: var(--neutral-bg);
            border: 1px solid var(--neutral-border);
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 8px;
            font-size: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            line-height: 1.3;
        }

        .option.is-correct {
            background: var(--success-bg);
            border-color: var(--success-border);
            color: var(--success-text);
        }

        .option-meta {
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
            margin-left: 10px;
        }

        #loading {
            text-align: center;
            display: none;
            margin: 20px 0;
            font-weight: 500;
            color: #5f6368;
        }

        #error-box {
            color: #d93025;
            background: #fce8e6;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
            font-size: 14px;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Шпаргалка НаУрок</h1>
    <div class="version">Версія скрипта: 5.0</div>
    
    <div id="error-box"></div>

    <div class="upload-box" onclick="document.getElementById('pdfFile').click()">
        <p>Натисніть сюди, щоб вибрати PDF файл з тесту</p>
        <div class="upload-btn">Обрати PDF</div>
        <input type="file" id="pdfFile" accept="application/pdf,.pdf" onchange="handleFileV5(event)">
    </div>

    <div id="loading">Читаємо PDF файл...</div>
    <div id="results"></div>
</div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    function showError(msg) {
        const err = document.getElementById('error-box');
        err.style.display = 'block';
        err.innerText = msg;
        document.getElementById('loading').style.display = 'none';
    }

    async function handleFileV5(event) {
        const file = event.target.files[0];
        if (!file) return;

        const err = document.getElementById('error-box');
        err.style.display = 'none';
        
        if (file.size === 0) {
            showError("Помилка: файл має нульовий розмір (0 байт).");
            return;
        }

        document.getElementById('loading').style.display = 'block';
        document.getElementById('results').innerHTML = '';

        try {
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            
            let fullText = '';
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();
                
                let items = textContent.items.map(item => ({
                    str: item.str,
                    x: item.transform[4],
                    y: item.transform[5]
                }));

                items.sort((a, b) => b.y - a.y || a.x - b.x);

                let lastY = null;
                let lineStr = '';
                for (let item of items) {
                    if (lastY !== null && Math.abs(item.y - lastY) > 5) {
                        fullText += lineStr + '\n';
                        lineStr = '';
                    }
                    lineStr += item.str + ' ';
                    lastY = item.y;
                }
                fullText += lineStr + '\n';
            }

            document.getElementById('loading').style.display = 'none';
            parsePDFV5(fullText);

        } catch (error) {
            console.error(error);
            showError("Помилка читання PDF: " + (error.message || error));
        }
    }

    function parsePDFV5(text) {
        const resultsContainer = document.getElementById('results');
        
        const startIndex = text.indexOf('Розбір відповідей');
        const cleanText = startIndex !== -1 ? text.substring(startIndex) : text;

        const lines = cleanText.split('\n').map(l => l.trim()).filter(Boolean);
        
        let questions = [];
        let currentQ = null;
        let mode = 'WAITING_FOR_QUESTION';

        lines.forEach(line => {
            // Надежный поиск строки заголовка (например, "Правильно 1" или "Без відповіді 2")
            const headerMatch = line.match(/^(Правильно|Без відповіді|Неправильно|частково)\s+(\d+)$/i) || 
                                line.match(/^(\d+)\s+(Правильно|Без відповіді|Неправильно|частково)$/i);

            if (headerMatch) {
                if (currentQ) {
                    questions.push(currentQ);
                }
                let status, num;
                if (isNaN(headerMatch[1])) {
                    status = headerMatch[1];
                    num = headerMatch[2];
                } else {
                    num = headerMatch[1];
                    status = headerMatch[2];
                }

                currentQ = {
                    status: status,
                    num: num,
                    text: '',
                    options: []
                };
                mode = 'WAITING_FOR_TEXT';
                return;
            }

            if (!currentQ) return;

            if (mode === 'WAITING_FOR_TEXT') {
                if (line === 'учня' || line === '—' || line === 'Предмет' || line === 'Учень') return;
                currentQ.text = line;
                mode = 'COLLECTING_OPTIONS';
            } else if (mode === 'COLLECTING_OPTIONS') {
                if (line === 'учня' || line === '—' || line === 'Предмет' || line === 'Учень') return;
                if (/^(Правильно|Без відповіді|Неправильно|частково)\s+\d+$/i.test(line)) return;

                const isCorrect = line.includes('правильна') || line.includes('правильно');
                const cleanOptText = line.replace(/правильна|правильно/gi, '').trim();

                if (cleanOptText.length > 0) {
                    currentQ.options.push({
                        text: cleanOptText,
                        correct: isCorrect
                    });
                }
            }
        });

        if (currentQ) {
            questions.push(currentQ);
        }

        let count = 0;
        questions.forEach(q => {
            if (!q.text || q.options.length === 0) return;

            const card = document.createElement('div');
            card.className = 'question-card';

            const isCorrectOverall = q.status.toLowerCase().includes('правильно');

            let optionsHtml = '';
            q.options.forEach(opt => {
                optionsHtml += `
                    <div class="option ${opt.correct ? 'is-correct' : ''}">
                        <span>${opt.text}</span>
                        ${opt.correct ? '<span class="option-meta">✓ правильна</span>' : ''}
                    </div>
                `;
            });

            card.innerHTML = `
                <div class="question-header">
                    <div class="question-number">${q.num}</div>
                    <div class="status-badge ${isCorrectOverall ? 'correct' : 'none'}">${q.status}</div>
                </div>
                <div class="question-text">${q.text}</div>
                <div class="options-list">${optionsHtml}</div>
            `;
            
            resultsContainer.appendChild(card);
            count++;
        });

        if (count === 0) {
            resultsContainer.innerHTML = '<p style="text-align:center; color: #d93025;">Не вдалося розібрати питання. Перевірте файл.</p>';
        }
    }
</script>

</body>
</html>
