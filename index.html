<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форматування відповідей НаУрок</title>
    <!-- Подключаем PDF.js для чтения PDF прямо в браузере -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        :root {
            --bg-color: #f4f5f7;
            --card-bg: #ffffff;
            --text-main: #111827;
            --success-bg: #e6f4ea;
            --success-border: #ceead6;
            --success-text: #137333;
            --neutral-bg: #f8f9fa;
            --neutral-border: #e9ecef;
            --badge-bg: #202124;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            font-size: 20px;
            text-align: center;
            margin-bottom: 20px;
        }

        .upload-box {
            background: var(--card-bg);
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            margin-bottom: 20px;
            cursor: pointer;
        }

        .upload-box input {
            display: none;
        }

        .upload-btn {
            background: #1a73e8;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            display: inline-block;
            font-weight: 500;
            margin-top: 10px;
        }

        /* Карточка вопроса */
        .question-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .question-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .question-number {
            background: var(--badge-bg);
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
        }

        .status-badge {
            font-size: 13px;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 500;
        }

        .status-badge.correct {
            background: #ceead6;
            color: var(--success-text);
        }

        .status-badge.none {
            background: #e8eaed;
            color: #5f6368;
        }

        .question-text {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            line-height: 1.4;
        }

        /* Варианты ответов */
        .option {
            background: var(--neutral-bg);
            border: 1px solid var(--neutral-border);
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 8px;
            font-size: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            line-height: 1.3;
        }

        .option.is-correct {
            background: var(--success-bg);
            border-color: var(--success-border);
            color: var(--success-text);
        }

        .option-meta {
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
            margin-left: 10px;
        }

        #loading {
            text-align: center;
            display: none;
            margin: 20px 0;
            font-weight: 500;
            color: #5f6368;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Шпаргалка НаУрок</h1>
    
    <div class="upload-box" onclick="document.getElementById('pdfFile').click()">
        <p>Натисніть сюди, щоб вибрати PDF файл з тестом</p>
        <div class="upload-btn">Обрати PDF</div>
        <input type="file" id="pdfFile" accept=".pdf" onchange="handleFile(event)">
    </div>

    <div id="loading">Обробка файлу...</div>
    <div id="results"></div>
</div>

<script>
    // Настройка воркера PDF.js
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    async function handleFile(event) {
        const file = event.target.files[0];
        if (!file) return;

        document.getElementById('loading').style.display = 'block';
        document.getElementById('results').innerHTML = '';

        const reader = new FileReader();
        reader.onload = async function() {
            const typedarray = new Uint8Array(this.result);
            const pdf = await pdfjsLib.getDocument(typedarray).promise;
            
            let fullText = '';
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();
                // Собираем текст построчно
                let lastY = null;
                let lineText = '';
                for (let item of textContent.items) {
                    if (lastY !== null && Math.abs(item.transform[5] - lastY) > 5) {
                        fullText += lineText + '\n';
                        lineText = '';
                    }
                    lineText += item.str + ' ';
                    lastY = item.transform[5];
                }
                fullText += lineText + '\n';
            }

            document.getElementById('loading').style.display = 'none';
            parseAndRender(fullText);
        };
        reader.readAsArrayBuffer(file);
    }

    function parseAndRender(text) {
        const resultsContainer = document.getElementById('results');
        
        // Простейший разбор текста по номерам вопросов (число в начале строки перед текстом вопроса или словом "Правильно")
        // Так как структура НаУрок специфичная, здесь делим по паттерну номера вопроса (например, "1 \n Правильно" или "1 \n Без відповіді")
        const rawQuestions = text.split(/(?=\n\d+\s+(?:Правильно|Без відповіді|Неправильно|частково))/g);

        rawQuestions.forEach((chunk, index) => {
            if (!chunk.trim()) return;

            // Извлекаем номер и статус
            const lines = chunk.trim().split('\n').map(l => l.trim()).filter(Boolean);
            let qNum = lines[0] || index;
            let status = lines[1] || 'Без відповіді';

            // Создаем карточку
            const card = document.createElement('div');
            card.className = 'question-card';

            const isCorrectOverall = status.toLowerCase().includes('правильно');

            card.innerHTML = `
                <div class="question-header">
                    <div class="question-number">${qNum}</div>
                    <div class="status-badge ${isCorrectOverall ? 'correct' : 'none'}">${status}</div>
                </div>
                <div class="question-text">Текст питання #${qNum} (тут буде витягнуте питання з PDF)</div>
                <div class="options-list">
                    <div class="option is-correct">
                        <span>Приклад правильної відповіді (авто-підсвічування)</span>
                        <span class="option-meta">✓ правильна</span>
                    </div>
                    <div class="option">
                        <span>Інший варіант відповіді</span>
                    </div>
                </div>
            `;
            resultsContainer.appendChild(card);
        });
    }
</script>

</body>
</html>
